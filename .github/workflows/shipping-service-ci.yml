name: Shipping Service CI

on:
  workflow_dispatch:


permissions:
  contents: read
  checks: write
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Shipping Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Shipping Service
      service-path: services/shipping-service
      docker-image-name: shipping-service
    #secrets: inherit
name: Terraform - Bootstrap GH Actions OIDC (plan only)

# This module creates the IAM roles other Terraform workflows assume, and
# changes here are rare and security-sensitive — applied by hand, see its
# README. CI only runs plan/validate when dispatched manually, never an automated apply.
on:
  workflow_dispatch:


concurrency:
  group: terraform-bootstrap-gh-actions-oidc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment-name: bootstrap
      working-directory: platform/terraform/bootstrap/gh-actions-oidc
      apply-enabled: false
      state-key: atlas-commerce/bootstrap/gh-actions-oidc/terraform.tfstate

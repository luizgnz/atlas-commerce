name: Reusable Service CI

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      service-path:
        required: true
        type: string
      docker-image-name:
        required: true
        type: string
      java-version:
        required: false
        type: string
        default: '21'
      maven-goals:
        required: false
        type: string
        default: 'clean verify'
      trivy-severity:
        required: false
        type: string
        default: 'CRITICAL,HIGH'
      force-ecr-push:
        description: |
          Push the image to ECR even when the caller is not a push to master
          (e.g. selective deploy via workflow_dispatch).
        required: false
        type: boolean
        default: false
      github-environment:
        description: |
          GitHub Environment whose Variables/Secrets supply AWS OIDC and ECR
          config (AWS_REGION, AWS_ACCOUNT_ID, AWS_ECR_PUSH_ROLE_ARN,
          ECR_REPOSITORY_PREFIX). Default is alpha.
        required: false
        type: string
        default: 'alpha'

permissions:
  contents: read
  checks: write
  security-events: write
  id-token: write

jobs:
  build-test-and-push:
    name: Build, Test and Push ${{ inputs.service-name }}
    runs-on: ubuntu-latest
    # Environment Variables (not repository vars) for AWS OIDC / ECR push.
    environment: ${{ inputs.github-environment }}

    defaults:
      run:
        working-directory: ${{ inputs.service-path }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # with:
        #   fetch-depth: 0
        #   token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java ${{ inputs.java-version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: maven
          cache-dependency-path: ${{ inputs.service-path }}/pom.xml

      - name: Build and Test with Maven
        run: mvn ${{ inputs.maven-goals }} -B --no-transfer-progress

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ==================== TRIVY SECURITY SCAN ====================
      - name: Build Docker Image (for scanning)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service-path }}
          file: ${{ inputs.service-path }}/Dockerfile
          push: false
          tags: ${{ inputs.docker-image-name }}:ci
          outputs: type=docker,dest=/tmp/${{ inputs.docker-image-name }}.tar

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          input: /tmp/${{ inputs.docker-image-name }}.tar
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: ${{ inputs.trivy-severity }}
          exit-code: '0'           # '0' for warning
          ignore-unfixed: true
          vuln-type: 'os,library'
          scan-type: 'image'

      - name: Upload Trivy Scan Results to GitHub Security Tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      # Fail only on main/master if critical vulnerabilities are found
      - name: Check for Critical Vulnerabilities
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        run: |
          if [ -f trivy-results.sarif ]; then
            CRITICAL_COUNT=$(jq -r '.runs[0].results | map(select(.properties.severity == "CRITICAL")) | length' trivy-results.sarif 2>/dev/null || echo 0)
            if [ "$CRITICAL_COUNT" -gt 0 ]; then
              echo "❌ Se encontraron vulnerabilidades CRITICAL en la imagen Docker"
              exit 1
            fi
          fi    

      # ==================== BUILD & PUSH ====================
      # - name: Log in to Docker Hub
      #   if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      #   uses: docker/login-action@v3
      #   with:
      #     username: ${{ secrets.DOCKERHUB_USERNAME }}
      #     password: ${{ secrets.DOCKERHUB_TOKEN }}

      # - name: Build and Push Docker Image
      #   if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
      #   uses: docker/build-push-action@v6
      #   with:
      #     context: ${{ inputs.service-path }}
      #     file: ${{ inputs.service-path }}/Dockerfile
      #     push: true
      #     tags: |
      #       ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker-image-name }}:${{ github.sha }}
      #       ${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.docker-image-name }}:latest
      #     # cache-from: type=gha
      #     # cache-to: type=gha,mode=max

      # ==================== BUILD & PUSH TO AMAZON ECR ====================
      - name: Configure AWS credentials through GitHub OIDC
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || inputs.force-ecr-push
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ECR_PUSH_ROLE_ARN }}
          role-session-name: atlas-${{ inputs.docker-image-name }}-${{ github.run_id }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}

      - name: Log in to Amazon ECR
        id: login_ecr
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || inputs.force-ecr-push
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve ECR image repository
        id: ecr_image
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || inputs.force-ecr-push
        env:
          ECR_PREFIX: ${{ vars.ECR_REPOSITORY_PREFIX }}
          REGISTRY: ${{ steps.login_ecr.outputs.registry }}
          IMAGE_NAME: ${{ inputs.docker-image-name }}
        run: |
          set -euo pipefail
          prefix="${ECR_PREFIX:-atlas-commerce}"
          prefix="${prefix#/}"
          prefix="${prefix%/}"
          echo "repository=${REGISTRY}/${prefix}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"

      - name: Build and Push Docker Image to Amazon ECR
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || inputs.force-ecr-push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.service-path }}
          file: ${{ inputs.service-path }}/Dockerfile
          push: true
          tags: |
            ${{ steps.ecr_image.outputs.repository }}:${{ steps.ecr_image.outputs.tag }}

      # ==================== TESTING ====================
      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: ${{ inputs.service-name }} Tests
          path: ${{ inputs.service-path }}/target/surefire-reports/*.xml
          reporter: java-junit
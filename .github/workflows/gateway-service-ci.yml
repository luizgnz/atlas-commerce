name: Gateway Service CI

on:
  workflow_dispatch:


permissions:
  contents: read
  checks: write
  security-events: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and Test Gateway Service
    uses: ./.github/workflows/reusable-service-ci.yml
    with:
      service-name: Gateway Service
      service-path: services/gateway-service
      docker-image-name: api-gateway
    #secrets: inherit
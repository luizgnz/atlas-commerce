name: Terraform - Live Alpha

on:
  workflow_dispatch:
    inputs:
      deploy_services:
        description: After Terraform apply, also build and deploy all application services (Deploy Services)
        type: boolean
        default: false

concurrency:
  group: terraform-live-alpha-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  security-events: write
  id-token: write
  pull-requests: write

jobs:
  terraform:
    name: Terraform
    uses: ./.github/workflows/reusable-terraform.yml
    with:
      environment-name: alpha
      working-directory: platform/terraform/live/aws/alpha
      state-key: atlas-commerce/alpha/terraform.tfstate
      require-master: false

  deploy-services:
    name: Deploy Services
    needs: terraform
    if: ${{ inputs.deploy_services }}
    uses: ./.github/workflows/deploy-services.yml
    with:
      auth: true
      catalog: true
      cart: true
      pricing: true
      coupon: true
      inventory: true
      payment: true
      order: true
      shipping: true
      notification: true
      audit: true
      gateway: true

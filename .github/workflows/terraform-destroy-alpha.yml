# Manual destroy of live/aws/alpha. Irreversible for that environment's AWS resources.
#
# Flow:
# 1) gate — Environment alpha-destroy (required reviewers)
# 2) destroy — Environment alpha (OIDC): sync ECR force_delete, then terraform destroy
name: Terraform - Destroy Alpha

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type destroy-alpha to confirm full terraform destroy of live/aws/alpha'
        required: true
        type: string

concurrency:
  group: terraform-live-alpha-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  gate:
    name: Approval gate
    if: inputs.confirm == 'destroy-alpha'
    runs-on: ubuntu-latest
    environment: alpha-destroy
    steps:
      - name: Confirmed
        run: echo "Destroy approved. Proceeding to terraform destroy (ECR force_delete)."

  destroy:
    name: Destroy alpha
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: alpha
    defaults:
      run:
        working-directory: platform/terraform/live/aws/alpha

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Load environment config
        id: config
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          config_file=platform/terraform/environments.yml
          get() { yq -r ".alpha.${1}" "${config_file}"; }
          for field in awsRegion awsAccountId terraformStateBucket terraformApplyRoleArn; do
            value="$(get "${field}")"
            if [ -z "${value}" ] || [ "${value}" = "null" ]; then
              echo "::error::${config_file} has no '${field}' for environment 'alpha'" >&2
              exit 1
            fi
          done
          {
            echo "aws-region=$(get awsRegion)"
            echo "aws-account-id=$(get awsAccountId)"
            echo "terraform-state-bucket=$(get terraformStateBucket)"
            echo "terraform-apply-role-arn=$(get terraformApplyRoleArn)"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.10.0'

      - name: Generate backend.hcl
        run: |
          cat > backend.hcl <<EOF
          bucket       = "${{ steps.config.outputs.terraform-state-bucket }}"
          key          = "atlas-commerce/alpha/terraform.tfstate"
          region       = "${{ steps.config.outputs.aws-region }}"
          encrypt      = true
          use_lockfile = true
          EOF

      - name: Configure AWS credentials (apply role)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ steps.config.outputs.aws-region }}
          role-to-assume: ${{ steps.config.outputs.terraform-apply-role-arn }}
          role-session-name: tf-destroy-alpha-${{ github.run_id }}
          allowed-account-ids: ${{ steps.config.outputs.aws-account-id }}

      - name: Terraform Init
        run: terraform init -backend-config=backend.hcl

      - name: Materialize terraform.tfvars for CI
        run: |
          if [ ! -f terraform.tfvars ] && [ -f terraform.tfvars.example ]; then
            cp terraform.tfvars.example terraform.tfvars
            echo "Using terraform.tfvars.example as terraform.tfvars"
          fi

      # force_delete is read from state on destroy; sync it before deleting repos with images.
      - name: Enable ECR force_delete in state
        run: |
          terraform apply -input=false -auto-approve \
            -target=module.ecr.aws_ecr_repository.this

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
